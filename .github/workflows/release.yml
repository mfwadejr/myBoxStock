# Creates a GitHub Release (with notes from CHANGELOG.md) whenever a version tag is pushed.
# Fails if the tag does not match package.json or CHANGELOG.md has no entry for the version.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and extract notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "Tag v$TAG does not match package.json version $PKG"; exit 1; }
          awk -v v="$TAG" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no entry for $TAG"; exit 1; }
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "myBoxStock $GITHUB_REF_NAME" --notes-file notes.md
